name: "Fly Destroy"

description: >
  Destroy Fly applications associated with closed pull requests.

inputs:
  fly-api-token:
    description: >
      Authenticate using a Fly API access token or with setting the `FLY_API_TOKEN`
      environment variable.
  fly-trace-cli:
    description: >
      Whether to enable tracing of the Fly CLI commands. Secrets are redacted in the logs.
      Defaults to `false`.
  fly-console-logs:
    description: >
      Whether to enable console logs for Fly CLI commands.
      Defaults to `false`.
  postgres-cluster:
    description: >
      The preview Postgres cluster app whose databases and roles are dropped
      for closed pull requests. Set together with `database-name`;
      both empty skips databases.
  database-name:
    description: >
      Database name template, must contain `${PR_NUMBER}` exactly once,
      for example `cdwr_cms_${PR_NUMBER}`. Set together with `postgres-cluster`.
  dry-run:
    description: >
      List what would be destroyed or dropped without doing it.
      Defaults to `false`.
    default: "false"
  token:
    description: >
      The token to use for repository authentication.
      For example `GITHUB_TOKEN`.
    required: true

outputs:
  destroyed:
    description: >
      A list of app names that were destroyed.
  skipped:
    description: >
      A list of app names that were skipped (e.g., failed to destroy).
  dropped-databases:
    description: >
      A list of database names that were dropped.
  skipped-databases:
    description: >
      A list of database names that could not be dropped.

runs:
  using: "node24"
  main: "../../dist/packages/fly-destroy-action/action.js"
