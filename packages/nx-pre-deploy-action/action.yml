name: "Nx Pre-deploy"

description: >
  Analyze the applications to deploy and to which environment.
  Discover from Infisical which deployments (host app and tenants) are switched on.

inputs:
  main-branch:
    description: >
      The main branch name.
      Defaults to the default branch of the repository.
  token:
    description: >
      The token to use for repository authentication.
      Defaults to `GITHUB_TOKEN`.
  infisical-client-id:
    description: >
      Infisical client ID for deployment discovery.
      Required when there are apps to deploy.
  infisical-client-secret:
    description: >
      Infisical client secret for deployment discovery.
      Required when there are apps to deploy.
  infisical-project-id:
    description: >
      Infisical project ID for deployment discovery.
      Required when there are apps to deploy.
  infisical-site:
    description: >
      Infisical site to use ('eu' or 'us').
      Defaults to 'eu'.
  pr-number:
    description: >
      The pull request number, used as the preview release lane
      (`preview.<pr-number>`) when resolving app versions.
      Optional - omitted for production releases.
  manual-app:
    description: >
      Manual override: specific app to deploy.
      Used for manual workflow dispatch to force deployment of a specific app.
      Optional - if not provided, affected apps will be deployed.
  manual-tenant:
    description: >
      Manual override: specific tenant ID to deploy.
      Used for manual workflow dispatch to deploy to a specific tenant only.
      Narrows the deployments switched on with `DEPLOY_ENABLED`, never bypasses it.
      Optional - if not provided, all enabled deployments are used.
  manual-environment:
    description: >
      Manual override: target environment (preview/production).
      Used for manual workflow dispatch to force deployment to a specific environment.
      Optional - if not provided, environment will be auto-detected.

outputs:
  apps:
    description: >
      JSON array of applications to deploy, limited to apps with a deployment
      switched on in Infisical. Selected by `nx release` bump
      rather than by `nx affected` - an app is listed when its conventional
      commits produce a version bump since its last release tag.
      Each entry has name, flyConfigFile, githubConfig, the resolved version
      and an optional sentry object ({ project, dsn }) resolved from
      `/apps/<app-name>` in Infisical. The sentry object carries no release
      yet - it is added by the caller once the version is known.
  environment:
    description: >
      The environment to deploy applications to ('preview', 'production').
      Empty string if the event couldn't match any environment.
  app-tenants:
    description: >
      JSON object mapping apps to their deployments. A host deployment is an
      empty object and comes first; a tenant deployment has tenant, env, and secrets.
      Example: { "web": [{}, { "tenant": "acme", "env": { "PUBLIC_URL": "https://acme.com" }, "secrets": { "API_KEY": "..." } }] }

runs:
  using: "node24"
  main: "../../dist/packages/nx-pre-deploy-action/action.js"
