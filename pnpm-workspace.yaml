catalog:
  react: ^19.0.0
  react-dom: ^19.0.0

overrides:
  react: "catalog:"
  react-dom: "catalog:"
  tar: ">=7.5.11"
  fast-xml-parser: ">=5.7.0"
  "@remix-run/server-runtime": ">=2.17.5 <3"
  # Remix v2 pins these exactly; only an override collapses the old copies
  react-router: ">=6.30.6 <7"
  react-router-dom: ">=6.30.6 <7"
  "@remix-run/router": ">=1.23.4 <2"

  # Transitive-only floors: nothing declares these directly, so a lockfile
  # refresh alone never reaches the stale copies.
  axios: ">=1.18.0 <2"
  dompurify: ">=3.4.13 <4"
  lodash: ">=4.18.0 <5"
  mongoose: ">=8.24.1 <9"
  qs: ">=6.16.0 <7"
  smol-toml: ">=1.7.1 <2"
  "@vitest/mocker": ">=4.1.11 <5"
  # Scoped to one line each: these packages have newer majors in the tree that
  # an unscoped floor would drag backwards.
  yaml@1: ">=1.10.3 <2"
  minimatch@7: ">=7.4.8 <8"
  js-yaml@3: ">=3.15.2 <4"
  js-yaml@4: ">=4.3.2 <5"
  undici@7: ">=7.29.0 <8"
  postcss: ">=8.5.14"
  "request>form-data": ">=2.5.4"
  # Ceiling: the provider and vitest itself must stay on the same major
  "@vitest/browser": ">=4.1.11 <5"
  "@xhmikosr/decompress": ">=11.1.3"
  shell-quote: ">=1.8.4"

allowBuilds:
  "@evilmartians/lefthook": true
  "@homebridge/node-pty-prebuilt-multiarch": true
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  core-js-pure: true
  esbuild: true
  less: true
  msw: true
  nx: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@nx/cypress@23.1.2 || 23.1.3"
  - "@nx/devkit@23.1.2 || 23.1.3"
  - "@nx/docker@23.1.2 || 23.1.3"
  - "@nx/esbuild@23.1.2 || 23.1.3"
  - "@nx/eslint-plugin@23.1.2 || 23.1.3"
  - "@nx/eslint@23.1.2 || 23.1.3"
  - "@nx/jest@23.1.2 || 23.1.3"
  - "@nx/js@23.1.2 || 23.1.3"
  - "@nx/next@23.1.2 || 23.1.3"
  - "@nx/node@23.1.2 || 23.1.3"
  - "@nx/nx-darwin-arm64@23.1.2 || 23.1.3"
  - "@nx/nx-darwin-x64@23.1.2 || 23.1.3"
  - "@nx/nx-freebsd-x64@23.1.2 || 23.1.3"
  - "@nx/nx-linux-arm-gnueabihf@23.1.2 || 23.1.3"
  - "@nx/nx-linux-arm64-gnu@23.1.2 || 23.1.3"
  - "@nx/nx-linux-arm64-musl@23.1.2 || 23.1.3"
  - "@nx/nx-linux-x64-gnu@23.1.2 || 23.1.3"
  - "@nx/nx-linux-x64-musl@23.1.2 || 23.1.3"
  - "@nx/nx-win32-arm64-msvc@23.1.2 || 23.1.3"
  - "@nx/nx-win32-x64-msvc@23.1.2 || 23.1.3"
  - "@nx/playwright@23.1.2 || 23.1.3"
  - "@nx/plugin@23.1.2 || 23.1.3"
  - "@nx/react@23.1.2 || 23.1.3"
  - "@nx/remix@23.1.2 || 23.1.3"
  - "@nx/storybook@23.1.2 || 23.1.3"
  - "@nx/vite@23.1.2 || 23.1.3"
  - "@nx/vitest@23.1.2 || 23.1.3"
  - "@nx/web@23.1.2 || 23.1.3"
  - "@nx/webpack@23.1.2 || 23.1.3"
  - "@nx/workspace@23.1.2 || 23.1.3"
  - create-nx-workspace@23.1.2 || 23.1.3
  - nx@23.1.2 || 23.1.3
