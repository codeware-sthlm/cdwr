catalog:
  react: ^19.0.0
  react-dom: ^19.0.0

overrides:
  react: "catalog:"
  react-dom: "catalog:"
  tar: ">=7.5.11"
  fast-xml-parser: ">=5.7.0"
  "@remix-run/server-runtime": ">=2.17.5 <3"
  # Remix v2 pins these exactly; only an override collapses the old copies
  react-router: ">=6.30.6 <7"
  react-router-dom: ">=6.30.6 <7"
  "@remix-run/router": ">=1.23.4 <2"

  # Transitive-only floors: nothing declares these directly, so a lockfile
  # refresh alone never reaches the stale copies.
  axios: ">=1.18.0 <2"
  dompurify: ">=3.4.13 <4"
  lodash: ">=4.18.0 <5"
  mongoose: ">=8.24.1 <9"
  qs: ">=6.16.0 <7"
  smol-toml: ">=1.7.1 <2"
  "@vitest/mocker": "4.1.11"
  # Scoped to one line each: these packages have newer majors in the tree that
  # an unscoped floor would drag backwards.
  yaml@1: ">=1.10.3 <2"
  minimatch@7: ">=7.4.8 <8"
  js-yaml@3: ">=3.15.2 <4"
  js-yaml@4: ">=4.3.2 <5"
  undici@7: ">=7.29.0 <8"
  postcss: ">=8.5.14"
  "request>form-data": ">=2.5.4"
  # Exact, like vitest itself: the family moves in lockstep
  "@vitest/browser": "4.1.11"
  "@xhmikosr/decompress": ">=11.1.3"
  shell-quote: ">=1.8.4"

allowBuilds:
  "@evilmartians/lefthook": true
  "@homebridge/node-pty-prebuilt-multiarch": true
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  core-js-pure: true
  esbuild: true
  less: true
  msw: true
  nx: true
  sharp: true
  unrs-resolver: true
