<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" class="cdwr-agent-map" role="img" aria-label="The human side on the left, the NUC on the right, and Linear, Supabase and GitHub between them. Tickets, events and code each move along their own row; events wake the NUC and refresh the Desk; Claude runs every session on both sides.">
<style>.cdwr-agent-map{--background:#f6f5f1;--card:#ffffff;--border:#d6d4cc;--foreground:#1e201d;--muted-foreground:#6a6e66;--muted:#eeede7;--primary:#2f6f5e;font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif}@media (prefers-color-scheme:dark){.cdwr-agent-map{--background:#151715;--card:#1d201c;--border:#34382f;--foreground:#e6e5df;--muted-foreground:#9ea298;--muted:#202420;--primary:#8ccbb4}}</style>
<rect x="0" y="0" width="960" height="560" fill="var(--background)"/>
<rect x="320" y="60" width="320" height="380" rx="12" fill="var(--muted)"/>
<text x="480" y="84" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">the cloud</text>
<rect x="40" y="100" width="220" height="320" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
<text x="150" y="140" font-size="15" fill="var(--foreground)" text-anchor="middle">You</text>
<text x="150" y="160" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">the human side: the Mac</text>
<text x="150" y="300" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">attended sessions</text>
<text x="150" y="316" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">the Agent Desk · notices</text>
<rect x="700" y="100" width="220" height="320" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
<text x="810" y="140" font-size="15" fill="var(--foreground)" text-anchor="middle">NUC</text>
<text x="810" y="160" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">the machine side, unattended</text>
<text x="810" y="300" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">the loop, woken by events</text>
<text x="810" y="316" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">keys from Infisical</text>
<rect x="380" y="110" width="200" height="70" rx="8" fill="var(--card)" stroke="var(--primary)" stroke-width="1.5"/>
<rect x="380" y="110" width="200" height="70" rx="8" fill="var(--primary)" opacity="0.12"/>
<text x="480.0" y="140" font-size="15" fill="var(--foreground)" text-anchor="middle">Linear</text>
<text x="480.0" y="158" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">tickets</text>
<line x1="260" y1="130" x2="371" y2="130" stroke="var(--primary)" stroke-width="2"/>
<polygon points="369,125.5 378,130 369,134.5" fill="var(--primary)"/>
<text x="318" y="121" font-size="11" fill="var(--foreground)" text-anchor="middle">label · answer</text>
<line x1="700" y1="130" x2="589" y2="130" stroke="var(--primary)" stroke-width="2"/>
<polygon points="591,125.5 582,130 591,134.5" fill="var(--primary)"/>
<text x="642" y="121" font-size="11" fill="var(--foreground)" text-anchor="middle">plan · question</text>
<line x1="584" y1="160" x2="691" y2="160" stroke="var(--muted-foreground)" stroke-width="1.5"/>
<polygon points="689,155.5 698,160 689,164.5" fill="var(--muted-foreground)"/>
<text x="642" y="176" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">reads</text>
<rect x="380" y="230" width="200" height="70" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
<text x="480.0" y="260" font-size="15" fill="var(--foreground)" text-anchor="middle">Supabase</text>
<text x="480.0" y="278" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">events · telemetry</text>
<line x1="480" y1="180" x2="480" y2="221" stroke="var(--muted-foreground)" stroke-width="1.5"/>
<polygon points="475.5,219 480,228 484.5,219" fill="var(--muted-foreground)"/>
<text x="492" y="208" font-size="11" fill="var(--muted-foreground)">webhook</text>
<line x1="480" y1="350" x2="480" y2="309" stroke="var(--muted-foreground)" stroke-width="1.5"/>
<polygon points="475.5,311 480,302 484.5,311" fill="var(--muted-foreground)"/>
<text x="492" y="330" font-size="11" fill="var(--muted-foreground)">webhook</text>
<line x1="376" y1="265" x2="269" y2="265" stroke="var(--muted-foreground)" stroke-width="1.5"/>
<polygon points="271,260.5 262,265 271,269.5" fill="var(--muted-foreground)"/>
<text x="318" y="256" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">the Desk refreshes</text>
<line x1="584" y1="265" x2="691" y2="265" stroke="var(--muted-foreground)" stroke-width="1.5"/>
<polygon points="689,260.5 698,265 689,269.5" fill="var(--muted-foreground)"/>
<text x="642" y="256" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">wakes the loop</text>
<rect x="380" y="350" width="200" height="70" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
<text x="480.0" y="380" font-size="15" fill="var(--foreground)" text-anchor="middle">GitHub</text>
<text x="480.0" y="398" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">code · PRs · CI</text>
<line x1="260" y1="370" x2="371" y2="370" stroke="var(--primary)" stroke-width="2"/>
<polygon points="369,365.5 378,370 369,374.5" fill="var(--primary)"/>
<text x="318" y="361" font-size="11" fill="var(--foreground)" text-anchor="middle">review · merge</text>
<line x1="700" y1="370" x2="589" y2="370" stroke="var(--primary)" stroke-width="2"/>
<polygon points="591,365.5 582,370 591,374.5" fill="var(--primary)"/>
<text x="642" y="361" font-size="11" fill="var(--foreground)" text-anchor="middle">branches · PRs</text>
<line x1="584" y1="400" x2="691" y2="400" stroke="var(--muted-foreground)" stroke-width="1.5"/>
<polygon points="689,395.5 698,400 689,404.5" fill="var(--muted-foreground)"/>
<text x="642" y="416" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">checks · reviews</text>
<rect x="40" y="480" width="880" height="56" rx="8" fill="var(--card)" stroke="var(--border)" stroke-width="1.5"/>
<text x="480.0" y="510" font-size="15" fill="var(--foreground)" text-anchor="middle">Claude</text>
<text x="480.0" y="528" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">runs every session, on both shores</text>
<line x1="150" y1="480" x2="150" y2="431" stroke="var(--muted-foreground)" stroke-width="1.5"/>
<polygon points="145.5,433 150,424 154.5,433" fill="var(--muted-foreground)"/>
<line x1="810" y1="480" x2="810" y2="431" stroke="var(--muted-foreground)" stroke-width="1.5"/>
<polygon points="805.5,433 810,424 814.5,433" fill="var(--muted-foreground)"/>
<path d="M 150,100 C 150,30 810,30 810,93" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5"/>
<polygon points="805.5,91 810,100 814.5,91" fill="var(--muted-foreground)"/>
<text x="480" y="40" font-size="11" fill="var(--muted-foreground)" text-anchor="middle">your session's heartbeat, so the NUC stays quiet while you work</text>
</svg>
