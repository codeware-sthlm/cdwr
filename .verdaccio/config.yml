# path to a directory with all packages
storage: ../tmp/local-registry/storage

# a list of other known repositories we can talk to
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    maxage: 60m
    # Verdaccio's defaults take the uplink offline for 5 minutes after 2 failed
    # requests, and answer 404 for every package not yet cached meanwhile - a
    # brief npm hiccup during a large install then fails it outright
    timeout: 60s
    max_fails: 20
    fail_timeout: 10s

# give all users (including non-authenticated users) full access because it is a local registry
packages:
  "@cdwr/*":
    access: $all
    publish: $all
    unpublish: $all
  "create-nx-payload":
    access: $all
    publish: $all
    unpublish: $all
  "**":
    access: $all
    publish: $all
    unpublish: $all
    # proxy requests to npm registry
    proxy: npmjs

# log settings
log:
  type: stdout
  format: pretty
  level: warn

publish:
  allow_offline: true # set offline to true to allow publish offline
