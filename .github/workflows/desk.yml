name: Agent Desk

on:
  pull_request:
    paths:
      - "apps/desk/**"
      - ".github/workflows/desk.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "apps/desk/**"
      - ".github/workflows/desk.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS 14 images were retired on 2026-11-02; 15 is arm64 as well
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm package manager
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desk/src-tauri -> target

      # Unsigned and not notarized; the target builds the frontend first
      # The desk compares its commit with main's newest desk build
      # The output is kept as an artifact, so a failed build can be read even when the job's
      # own log never reaches GitHub (the macos-15 runner lost it once)
      - name: Build the app
        run: |
          set -o pipefail
          pnpm nx tauri-build desk --configuration release -- --target aarch64-apple-darwin --verbose 2>&1 | tee build.log
        env:
          VITE_DESK_SHA: ${{ github.sha }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: agent-desk-build-log
          path: build.log
          retention-days: 3

      - name: Collect the bundle
        run: |
          bundle=apps/desk/src-tauri/target/aarch64-apple-darwin/release/bundle
          mkdir -p out
          cp "$bundle"/dmg/*.dmg out/
          for app in "$bundle"/macos/*.app; do
            ditto -c -k --keepParent "$app" "out/$(basename "$app").zip"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: agent-desk-macos-arm64
          path: out/*
          if-no-files-found: error
          retention-days: 14
