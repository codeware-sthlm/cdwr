name: Desk image

# The Agent Desk as a static site, served on the tailnet by the NUC (apps/agent-host/compose.yaml,
# the `desk` service). Built on main whenever the desk changes; `cdwr agent deploy` pulls it.

on:
  push:
    branches: [main]
    paths:
      - "apps/desk/**"
      - ".github/workflows/desk-image.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: desk-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/codeware-sthlm/cdwr-desk
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/desk/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VITE_DESK_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
