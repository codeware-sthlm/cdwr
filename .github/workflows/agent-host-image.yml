name: Agent host image

on:
  push:
    branches: [main]
    paths:
      - "apps/agent-host/**"
      - "tools/cdwr/agent-queue/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build at a time, in order, so the `main` tag and the desk's `builds` row name the same commit
concurrency:
  group: agent-host-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/codeware-sthlm/cdwr-agent
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/agent-host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: AGENT_IMAGE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
