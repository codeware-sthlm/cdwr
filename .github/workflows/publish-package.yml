# Semi-automated Nx releases where pre-created tags gets published to NPM.
# The tags has been created locally using `nx release-cli`.
#
# `nx release-cli` creates the GitHub release together with its tag through the
# API, which fires only `release: published`, not a tag push. The release event
# is therefore the real trigger; the tag push covers tags pushed by hand.
# Both resolve to the same tag, so the concurrency group keeps them from
# publishing twice.
#
# This workflow will stage on NPM, awaiting approval:
#  - a single package identified by a pushed tag
#  - a single package identified by a tag given when manually triggered
#  - all pending packages when manually triggered without a tag

name: Publish package

on:
  push:
    # Should match the patterns in our GitHub tag rulesets to be consistent
    tags:
      - "*-[0-9]*.[0-9]*.[0-9]*" # Matches any package name followed by semver, e.g. core-2.0.0
      - "*-[0-9]*.[0-9]*.[0-9]*-*.[0-9]*" # Also matches prerelease versions, e.g. core-2.0.0-beta.1
      # Apps are versioned by the deployment workflow and never published;
      # keep in step with the `apps` release group in nx.json
      - "!builder-*"
      - "!cms-*"
      - "!web-*"
      - "!umami-*"
      - "!headless-*"

  # The trigger for `nx release-cli`, which creates tag and release together
  release:
    types: [published]

  # Manually trigger publish for pending packages or a specific tag
  workflow_dispatch:
    inputs:
      tag:
        description: Publish a specific tag (e.g. nx-payload-2.1.0). Leave empty to publish pending packages.
        required: false
        type: string
      dry-run:
        description: Do not stage anything, just see what would be staged.
        required: false
        default: false
        type: boolean

env:
  NX_NO_CLOUD: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Apps are versioned by the deployment workflow and never published, but their
    # releases fire this event too; keep in step with the `apps` release group in nx.json
    if: >-
      github.event_name != 'release' ||
      !(startsWith(github.event.release.tag_name, 'builder-') ||
      startsWith(github.event.release.tag_name, 'cms-') ||
      startsWith(github.event.release.tag_name, 'web-') ||
      startsWith(github.event.release.tag_name, 'umami-') ||
      startsWith(github.event.release.tag_name, 'headless-'))

    permissions:
      contents: read
      id-token: write # npm provenance

    # Avoid duplicate runs if both push and release fire for the same tag
    concurrency:
      group: publish-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name || github.run_id }}
      # Queue, never cancel: a publish cut off midway is worse than a duplicate run, which nx skips
      cancel-in-progress: false

    steps:
      - name: Resolve context (tag or pending)
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DRY_RUN: ${{ github.event.inputs['dry-run'] || 'false' }}
        run: |
          DRY_FLAG=""
          PACKAGE=""
          TAG=""
          if [ -n "$DISPATCH_TAG" ]; then
            TAG="$DISPATCH_TAG"
          elif [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          fi
          if [ -n "$TAG" ]; then
          MODE="tag"
            PACKAGE="${TAG%-*}"
          else
            MODE="pending"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi

          echo "dry_flag=$DRY_FLAG" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"        >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE"  >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "Resolved mode=$MODE tag=$TAG package=$PACKAGE dry_flag=$DRY_FLAG"

      # Unified checkout for all cases:
      # - tag push or release -> checks out that tag
      # - manual w/o tag -> checks out the branch chosen in the UI (or default branch)
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ctx.outputs.tag || github.ref }}
          fetch-depth: 0
          filter: tree:0

      # A tag may name a single project or a member of a fixed release group -
      # Nx refuses `-p <project>` for the latter, it must be published as a whole group.
      - name: Resolve release group
        id: group
        if: steps.ctx.outputs.mode == 'tag'
        run: |
          set -euo pipefail

          PACKAGE="${{ steps.ctx.outputs.package }}"
          GROUP=$(jq -r --arg p "$PACKAGE" '
            [.release.groups
              | to_entries[]
              | select(.value.projectsRelationship == "fixed")
              | select((.key == $p) or (.value.projects // [] | index($p) != null))
              | .key
            ] | first // empty
          ' nx.json)
          if [ -n "$GROUP" ]; then
            PROJECTS=$(jq -r --arg g "$GROUP" '.release.groups[$g].projects | join(",")' nx.json)
            echo "is_group=true"       >> "$GITHUB_OUTPUT"
            echo "group=$GROUP"        >> "$GITHUB_OUTPUT"
            echo "projects=$PROJECTS"  >> "$GITHUB_OUTPUT"
            echo "'$PACKAGE' belongs to fixed release group '$GROUP' (projects: $PROJECTS)"
          else
            echo "is_group=false"    >> "$GITHUB_OUTPUT"
            echo "projects=$PACKAGE" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6

      # No registry-url: it templates an _authToken=${NODE_AUTH_TOKEN} line into
      # .npmrc regardless of whether that env var is set, and an empty token there
      # makes npm attempt (and fail) classic auth instead of falling through to
      # OIDC trusted publishing. npm already defaults to registry.npmjs.org.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Verify a package by tag is actually configured for publishing;
      # the steps that follow only run when it is
      - name: Verify publishable package by tag
        id: verify
        run: |
          if [ "${{ steps.ctx.outputs.mode }}" != "tag" ]; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.group.outputs.is_group }}" = "true" ]; then
            echo "'${{ steps.ctx.outputs.package }}' belongs to fixed release group '${{ steps.group.outputs.group }}' - will publish: ${{ steps.group.outputs.projects }}"
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          else
            PROJECTS=$(pnpm nx show projects --with-target nx-release-publish)
            if echo "$PROJECTS" | grep -qx "^${{ steps.ctx.outputs.package }}$"; then
              echo "Package '${{ steps.ctx.outputs.package }}' is valid for publishing"
              echo "publishable=true" >> "$GITHUB_OUTPUT"
            else
              echo "'${{ steps.ctx.outputs.package }}' is not a project configured for publishing"
              echo "Publishable projects:"
              echo "$PROJECTS"
              echo "Skipping publish"
              echo "publishable=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Build package (or all group members) by tag, or all publishable packages
      - name: Build
        if: steps.verify.outputs.publishable == 'true'
        run: |
          if [ "${{ steps.ctx.outputs.mode }}" = "tag" ]; then
            pnpm nx run-many -t build -p "${{ steps.group.outputs.projects }}"
          else
            pnpm nx show projects --with-target nx-release-publish | xargs -t pnpm nx run-many -t build -p
          fi

      # Trusted publishers only allow staging: the package waits on npm until a
      # human approves it with 2FA (`pnpm stage approve <id>`, or on npmjs.com).
      # Auth is via npm Trusted Publishing (OIDC) - no NODE_AUTH_TOKEN needed,
      # relies on the id-token: write permission above.
      - name: Stage
        if: steps.verify.outputs.publishable == 'true'
        run: |
          set -euo pipefail

          if [ "${{ steps.ctx.outputs.mode }}" = "tag" ]; then
            PROJECTS=$(echo "${{ steps.group.outputs.projects }}" | tr ',' ' ')
          else
            # Only projects with an nx-release-publish target - the "apps" release
            # group (cms, headless) is versioned for deployment and never published.
            PROJECTS=$(pnpm nx show projects --with-target nx-release-publish)
          fi

          for PROJECT in $PROJECTS; do
            DIR=$(pnpm nx show project "$PROJECT" --json | jq -r '.targets["nx-release-publish"].options.packageRoot')
            NAME=$(jq -r .name "$DIR/package.json")
            VERSION=$(jq -r .version "$DIR/package.json")
            # Skip a version npm already has, published or staged awaiting approval
            if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" ]; then
              echo "$NAME@$VERSION is already on npm, skipping"
              continue
            fi
            if pnpm stage list "$NAME" --json 2>/dev/null | grep -q "\"$VERSION\""; then
              echo "$NAME@$VERSION is already staged, skipping"
              continue
            fi
            # Prereleases never take the latest tag
            DIST_TAG=latest
            case "$VERSION" in *-*) DIST_TAG=next ;; esac
            echo "Staging $PROJECT ($NAME@$VERSION) from $DIR"
            pnpm stage publish "$DIR" --access public --tag "$DIST_TAG" --no-git-checks ${{ steps.ctx.outputs.dry_flag }} --json | tee "$RUNNER_TEMP/stage-$PROJECT.json"
            {
              if [ -n "${{ steps.ctx.outputs.dry_flag }}" ]; then
                echo "### Dry run: would stage $PROJECT ($NAME@$VERSION, tag $DIST_TAG)"
              else
                echo "### Staged $PROJECT ($NAME@$VERSION, tag $DIST_TAG)"
              fi
              echo '```json'
              cat "$RUNNER_TEMP/stage-$PROJECT.json"
              echo '```'
              if [ -z "${{ steps.ctx.outputs.dry_flag }}" ]; then
                echo "Approve with \`pnpm stage approve <stage-id> --otp <code>\` or on npmjs.com; in a group, approve dependencies first (nx-payload before create-nx-payload)."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          done
        env:
          NPM_CONFIG_PROVENANCE: true
