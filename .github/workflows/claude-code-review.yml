name: Claude Code Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".github/CODEOWNERS"
      - "LICENSE"
      - "libs/shared/util/seed/src/lib/bundled/media/**"

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

# A new push cancels the review of the previous commit. (Matches ci.yml.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork PRs get no secrets, so the review would fail without the token.
    # Drafts are reviewed once they are ready. Machine-driven PRs are skipped:
    # renovate branches (matched on head_ref, as in ci.yml) and bot authors
    # (nx-migrate, the agent queue), which have their own review paths.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'renovate') &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Only the runner's own settings load: the repo's .claude/settings.json
          # (hooks, plugins) is PR-controlled and must not run with the token.
          claude_args: '--setting-sources user --allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
