app = 'cdwr-builder'
primary_region = 'arn'

[build]
  dockerfile = "Dockerfile"

# The deploy action gives every app public addresses, so the cms reaches it as
# https://<app>.fly.dev with the bearer token; fly-proxy starts a suspended
# machine on the first request
[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  method = 'GET'
  path = '/api/health'
  grace_period = '10s'
  interval = '20s'
  timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
