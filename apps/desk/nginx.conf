# The Agent Desk as a static site (apps/desk/Dockerfile). Single page: every path serves
# index.html, Vite's hashed assets cache for a year, index.html never. The CSP is the Tauri
# window's (src-tauri/tauri.conf.json) plus Linear's API, sent as a header so the Tauri build's
# own policy, with the nonces of its injected scripts, stays the only one inside the app.
# Every header is set at the server level: a location with an add_header of its own would drop
# the rest, so the cache header comes from a map instead.
map $uri $desk_cache {
  ~^/assets/ "public, max-age=31536000, immutable";
  default "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  add_header Cache-Control $desk_cache always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.linear.app; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # Not in nginx's mime.types; without it Safari gets an octet-stream under nosniff
  location = /manifest.webmanifest {
    types {}
    default_type application/manifest+json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
