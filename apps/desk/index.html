<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Desk</title>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div class="brand">
          <h1>Agent Desk</h1>
          <span class="sub"
            >cdwr · what the work queue does next, and what waits on you</span
          >
        </div>
        <div class="tools">
          <a
            class="who"
            href="https://github.com/apps/codeware-agent"
            target="_blank"
            rel="noopener"
            title="Commits, pull requests and review replies are made as this GitHub App"
            ><img class="av" src="" data-agent-avatar alt="" />on GitHub as
            codeware-agent[bot]</a
          ><span id="status" class="status" aria-live="polite"></span
          ><span id="fresh">Loading…</span
          ><button id="refresh" type="button" class="tool">Refresh</button
          ><button
            id="settings"
            type="button"
            class="tool"
            aria-label="Settings"
          >
            Settings
          </button>
        </div>
      </header>

      <div id="notice" hidden></div>

      <section
        class="cards"
        id="cards"
        aria-label="Session and what waits on you"
      ></section>

      <section
        class="capacity"
        id="capacity"
        aria-label="Capacity: limits and hosts"
      ></section>

      <nav class="more" id="more" aria-label="More detail"></nav>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <aside
      class="sheet"
      id="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheet-title"
      hidden
    >
      <button
        type="button"
        class="sheet-handle"
        id="sheet-handle"
        aria-label="Close"
      ></button>
      <div class="sheet-head">
        <div>
          <h2 id="sheet-title"></h2>
          <p id="sheet-sub"></p>
        </div>
        <button type="button" id="sheet-close">Close</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
