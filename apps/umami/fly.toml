app = 'cdwr-umami'
primary_region = 'arn'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: a suspended machine keeps its database sockets open, and the
  # first request after a wake times out; min_machines_running alone did not
  # stop the autostop from suspending the only machine
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  method = 'GET'
  path = '/api/heartbeat'
  grace_period = '30s'
  interval = '20s'
  timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
